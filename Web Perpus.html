
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan SMP Negeri 1</title>
    <style>
        /* CSS / Tampilan */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #1d3557;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #457b9d;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .book-card h3 {
            color: #1d3557;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .book-card p {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.available {
            background-color: #d4edda;
            color: #155724;
        }

        .status.borrowed {
            background-color: #f8d7da;
            color: #721c24;
        }

        footer {
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            background-color: #1d3557;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Perpustakaan Digital SMP</h1>
        <p>Membaca adalah Jendela Dunia</p>
    </header>

    <nav>
        <a href="#">Beranda</a>
        <a href="#katalog">Katalog Buku</a>
        <a href="#informasi">Informasi</a>
    </nav>

    <div class="container">
        <!-- Fitur Pencarian -->
        <input type="text" id="searchInput" class="search-bar" placeholder="Cari judul buku atau pengarang..." onkeyup="searchBooks()">

        <!-- Daftar Katalog Buku -->
        <h2 id="katalog" style="margin-bottom: 15px;">Daftar Buku</h2>
        <div class="book-grid" id="bookList">
            <!-- Data buku diisi oleh JavaScript -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Perpustakaan SMP. All rights reserved.</p>
    </footer>

    <!-- JavaScript / Logika Interaktif -->
    <script>
        // Data Buku (Array of Objects)
        const books = [
            { title: "Matematika Kelas 7", author: "Kemendikbud", category: "Pelajaran", available: true },
            { title: "IPA Terpadu Kelas 8", author: "Tim Abdi Guru", category: "Pelajaran", available: true },
            { title: "Bahasa Indonesia Kelas 9", author: "Eko Suroso", category: "Pelajaran", available: false },
            { title: "Laskar Pelangi", author: "Andrea Hirata", category: "Novel", available: true },
            { title: "Sejarah Nusantara", author: "Bambang Soekarno", category: "Sejarah", available: false },
            { title: "Ensiklopedia Sains Anak", author: "Prof. Haryono", category: "Referensi", available: true }
        ];

        // Fungsi menampilkan data buku ke halaman HTML
        function displayBooks(data) {
            const bookList = document.getElementById('bookList');
            bookList.innerHTML = '';

            if (data.length === 0) {
                bookList.innerHTML = '<p>Buku tidak ditemukan.</p>';
                return;
            }

            data.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <h3>${book.title}</h3>
                    <p><strong>Pengarang:</strong> ${book.author}</p>
                    <p><strong>Kategori:</strong> ${book.category}</p>
                    <span class="status ${book.available ? 'available' : 'borrowed'}">
                        ${book.available ? 'Tersedia' : 'Dipinjam'}
                    </span>
                `;
                bookList.appendChild(card);
            });
        }

        // Fungsi pencarian buku secara realtime
        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredBooks = books.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
            displayBooks(filteredBooks);
        }

        // Tampilkan semua buku saat pertama kali dibuka
        displayBooks(books);
    </script>
</body>
</html>
